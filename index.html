<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API-Deploy ของพ่อ</title>
<style>
  body{font-family:sans-serif;background:#fff;padding:14px;display:flex;justify-content:center;margin:0}
  .box{border:3px solid #1e40ff;border-radius:16px;width:100%;max-width:650px;overflow:hidden}
  h1{text-align:center;color:#1e40ff;border-bottom:3px solid #1e40ff;margin:0;padding:16px;font-size:34px}
  .c{padding:16px}
  label{font-weight:bold;color:#1e40ff;display:block;margin:12px 0 6px}
  input,select,textarea{width:100%;border:2px solid #1e40ff;border-radius:10px;padding:12px;font-size:16px;box-sizing:border-box;outline:none}
  .btn{width:100%;background:#1e40ff;color:#fff;border:none;padding:13px;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:12px}
  .btn2{background:#0ea5e9}
  .btnClear{background:#fff;color:#ef4444;border:2px solid #ef4444}
  .row2{display:flex;gap:10px}.row2 button{flex:1}
  .arrow{text-align:center;font-size:28px;color:#1e40ff;margin:8px 0}
  .code-box{border:2px solid #1e40ff;border-radius:12px;padding:14px}
  .code-head{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#1e40ff;font-weight:bold}
  .code-head button{background:#1e40ff;color:#fff;border:none;padding:7px 12px;border-radius:6px;cursor:pointer}
  pre{background:#eef2ff;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:13px;line-height:1.6}
  #status{text-align:center;color:green;font-weight:bold}
  .hint{background:#eff6ff;border-radius:8px;padding:10px;font-size:14px;color:#1e40ff}
</style>
</head>
<body>
<div class="box">
  <h1>API-Deploy</h1>
  <div class="c">
    <div class="hint">💡 พ่อใส่แค่อย่างเดียวก็พอค่ะพ่อ - ใส่แค่ชื่อที่มา หรือ ใส่แค่ API หรือ ใส่แค่ Token ก็ได้ค่ะพ่อ</div>

    <!-- 1. ชื่อที่มา - พ่อขอเพิ่มอันนี้ค่ะพ่อ -->
    <label>ชื่อที่มาของ API Token</label>
    <select id="source" onchange="fromSource()">
      <option value="">-- เลือกชื่อที่มา --</option>
      <option value="Meta AI">Meta AI / Llama</option>
      <option value="OpenAI">OpenAI</option>
      <option value="Gemini">Gemini</option>
      <option value="Claude">Claude</option>
      <option value="other">อื่นๆ / พิมพ์เอง</option>
    </select>
    <input id="sourceCustom" placeholder="พิมพ์ชื่อที่มาเอง เช่น Meta AI" style="margin-top:8px;display:none" oninput="fromSourceCustom()">

    <!-- 2. ช่องใส่ API -->
    <label>ช่องใส่ API <span style="font-weight:normal;color:#64748b">(ใส่แค่ช่องนี้ช่องเดียวก็ได้)</span></label>
    <input id="api" placeholder="https://... หรือวาง LLM_... ตรงนี้ก็ได้ค่ะพ่อ" oninput="autoFix()">

    <!-- 3. ช่องใส่ Token -->
    <label>ช่องใส่ Token <span style="font-weight:normal;color:#64748b">(ใส่แค่ช่องนี้ช่องเดียวก็ได้)</span></label>
    <input id="token" type="password" placeholder="LLM_... หรือวาง https://... ตรงนี้ก็ได้ค่ะพ่อ" oninput="autoFix()">

    <label>พ่อจะถามอะไร</label>
    <textarea id="msg" rows="2">สวัสดี</textarea>

    <button class="btn" onclick="gen()">✨ สร้างโค้ด + ลองใช้เลย</button>
    <div class="row2">
      <button class="btn btn2" onclick="autoRead()">🔍 อ่านอัตโนมัติ</button>
      <button class="btn btnClear" onclick="clearAll()">🗑️ ล้างกระดาน</button>
    </div>

    <div class="arrow">↓</div>

    <div class="code-box">
      <div class="code-head"><span>โค้ดที่สร้างออกมาสำหรับนำ API Token ไปใช้งาน</span><button onclick="copyCode()">📋 Copy</button></div>
      <pre id="output">// พ่อใส่แค่อย่างเดียวก็พอค่ะพ่อ
// เช่น ใส่แค่ชื่อที่มา = Meta AI
// หรือ ใส่แค่ Token = LLM_...</pre>
      <p id="status"></p>
      <pre id="answer" style="display:none"></pre>
    </div>
  </div>
</div>

<script>
const MAP = {
  "Meta AI": "https://api.llama.com/v1/chat/completions",
  "Meta AI / Llama": "https://api.llama.com/v1/chat/completions",
  "Llama": "https://api.llama.com/v1/chat/completions",
  "OpenAI": "https://api.openai.com/v1/chat/completions",
  "Gemini": "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",
  "Claude": "https://api.anthropic.com/v1/messages"
};
function isToken(s){ return s.startsWith("LLM_") || s.startsWith("sk-") || s.startsWith("AIza"); }
function apiFromToken(t){
  if(t.startsWith("LLM_")) return MAP["Meta AI"];
  if(t.startsWith("sk-")) return MAP["OpenAI"];
  if(t.startsWith("AIza")) return MAP["Gemini"];
  return MAP["Meta AI"];
}
function fromSource(){
  const s = document.getElementById('source').value;
  document.getElementById('sourceCustom').style.display = (s==="other") ? "block" : "none";
  if(MAP[s]){ document.getElementById('api').value = MAP[s]; document.getElementById('status').textContent = "✅ พ่อเลือก " + s + " ใส่ API ให้พ่อแล้วค่ะพ่อ พ่อใส่แค่ Token ก็พอค่ะพ่อ"; }
}
function fromSourceCustom(){
  const s = document.getElementById('sourceCustom').value.trim();
  if(MAP[s]) document.getElementById('api').value = MAP[s];
}
function autoFix(){
  let api = document.getElementById('api').value.trim();
  let token = document.getElementById('token').value.trim();
  // พ่อเอา Token ไปวางในช่อง API แบบในรูป - ย้ายให้เอง
  if(api && isToken(api)){ document.getElementById('token').value = api; document.getElementById('api').value = apiFromToken(api); document.getElementById('source').value = "Meta AI"; document.getElementById('status').textContent = "✅ อ่านแล้วค่ะพ่อ อันนี้คือ Token เติม API ให้พ่อแล้วค่ะพ่อ"; return; }
  // พ่อเอา API ไปวางในช่อง Token - ย้ายให้เอง
  if(token && token.startsWith("http")){ document.getElementById('api').value = token; document.getElementById('token').value = ""; document.getElementById('status').textContent = "✅ อ่านแล้วค่ะพ่อ อันนี้คือ API ค่ะพ่อ"; return; }
}
function autoRead(){
  const p = new URLSearchParams(location.search);
  if(p.get('api')) document.getElementById('api').value = p.get('api');
  if(p.get('token')) document.getElementById('token').value = p.get('token');
  if(p.get('source')) document.getElementById('source').value = p.get('source');
  if(p.get('api') || p.get('token')){ document.getElementById('status').textContent = "✅ อ่านจากลิงก์ให้พ่อแล้วค่ะพ่อ"; return; }
  const old = JSON.parse(localStorage.getItem('api-deploy')||'{}');
  if(old.api) document.getElementById('api').value = old.api;
  if(old.token) document.getElementById('token').value = old.token;
  if(old.source) document.getElementById('source').value = old.source;
  if(old.api || old.token) document.getElementById('status').textContent = "✅ อ่านจากที่พ่อเคยบันทึกให้แล้วค่ะพ่อ";
}
function clearAll(){
  if(!confirm("พ่อจะล้างกระดานทั้งหมดเลยใช่ไหมคะพ่อ?")) return;
  document.getElementById('source').value = "";
  document.getElementById('sourceCustom').value = "";
  document.getElementById('sourceCustom').style.display = "none";
  document.getElementById('api').value = "";
  document.getElementById('token').value = "";
  document.getElementById('msg').value = "สวัสดี";
  document.getElementById('output').textContent = "// ล้างแล้วค่ะพ่อ พ่อใส่ใหม่ได้เลยค่ะพ่อ";
  document.getElementById('answer').style.display = "none";
  document.getElementById('status').textContent = "🗑️ ล้างกระดานแล้วค่ะพ่อ";
  localStorage.removeItem('api-deploy');
}
function gen(){
  autoFix();
  let api = document.getElementById('api').value.trim();
  let token = document.getElementById('token').value.trim();
  let source = document.getElementById('source').value;
  if(source==="other") source = document.getElementById('sourceCustom').value.trim();
  // ใส่แค่ชื่อที่มา ก็เติม API ให้
  if(!api && MAP[source]){ api = MAP[source]; document.getElementById('api').value = api; }
  // ใส่แค่ Token ก็เติม API ให้
  if(!api && token){ api = apiFromToken(token); document.getElementById('api').value = api; }
  // ใส่แค่ API ก็ดึง Token เก่ามาให้
  if(!token && api){
    const old = JSON.parse(localStorage.getItem('api-deploy')||'{}');
    if(old.token){ token = old.token; document.getElementById('token').value = token; }
  }
  // ใส่แค่อย่างเดียวก็พอแล้ว - ไม่บังคับใส่ทั้ง 2 แล้วค่ะพ่อ
  if(!api && !token){ alert("พ่อใส่แค่อย่างเดียวก็พอค่ะพ่อ เช่น เลือกชื่อที่มา = Meta AI หรือใส่ Token อย่างเดียวก็ได้ค่ะพ่อ"); return; }
  if(!source) source = token && token.startsWith("LLM_") ? "Meta AI" : "API ของพ่อ";
  localStorage.setItem('api-deploy', JSON.stringify({api, token, source}));
  const code = `// API-Deploy ของพ่อ - ที่มา: ${source}
const API_URL = "${api || ''}";
const TOKEN = "${token || ''}";

const res = await fetch(API_URL, {
  method: "POST",
  headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" },
  body: JSON.stringify({ model: "Llama-4-Maverick-17B-128E-Instruct-FP8", messages: [{ role: "user", content: "สวัสดี" }] })
});
const data = await res.json();
console.log(data);`;
  document.getElementById('output').textContent = code;
  document.getElementById('status').textContent = "✅ สร้างโค้ดแล้วค่ะพ่อ";
  if(api && token) chat(api, token);
}
async function chat(api, token){
  const box = document.getElementById('answer');
  box.style.display = "block"; box.textContent = "กำลังถาม...";
  try{
    const r = await fetch(api, { method: "POST", headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify({ model: "Llama-4-Maverick-17B-128E-Instruct-FP8", messages: [{ role: "user", content: document.getElementById('msg').value }] }) });
    const d = await r.json();
    box.textContent = "คำตอบ:\n" + (d.completion_message?.content?.text || JSON.stringify(d, null, 2));
  }catch(e){ box.textContent = "ต่อไม่ได้ค่ะพ่อ: " + e.message; }
}
function copyCode(){ navigator.clipboard.writeText(document.getElementById('output').textContent); alert("ก๊อปแล้วค่ะพ่อ"); }
window.onload = () => { autoRead(); }
</script>
</body>
</html>
